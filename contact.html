<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"/>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact | Julli Samson</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAVIGATION -->
  <nav>
    <div class="logo">Julli Samson</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="work.html">Work</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <!-- CONTACT SECTION -->
  <section class="contact">
    <div class="contact-header">
      <h2>Let's Work Together</h2>
      <p>Got a project in mind? I'd love to hear about it.</p>
    </div>

    <div class="contact-wrapper">

      <!-- CONTACT FORM -->
      <div class="contact-form">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" placeholder="Jane Smith" />
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="jane@email.com" />
        </div>
        <div class="form-group">
          <label for="project">Project Type</label>
          <select id="project">
            <option value="">Select one...</option>
            <option value="reel">Social Reel</option>
            <option value="brand">Brand Content</option>
            <option value="event">Event Coverage</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="message">Tell Me More</label>
          <textarea id="message" rows="5" placeholder="What are you working on?"></textarea>
        </div>
        <button class="btn" type="button">Send Message</button>
      </div>

      <!-- CONTACT DETAILS -->
      <div class="contact-details">
        <h3>Or reach me directly</h3>
        <p>📧 your@email.com</p>
        <p>📍 Melbourne, Australia</p>
        <p>💼 Available for freelance projects</p>
      </div>

    </div>
  </section>

</body>
</html>
